#annotations: []
#podAnnotations: []
#replicaCount: 1
env:
  - name: ASPNETCORE_URLS
    value: "http://localhost:8080"
probe:
  path: /health
#  port: 8080
startupProbe:
  enabled: true
#livenessProbe:
#readinessProbe:
ingress:
  enabled: true
  ingressClassName: nginx
  rules:
    - host: PROD-URL
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: PROJECT_NAME-helm
                port:
                  number: 80

# Uncomment to enable opentelemetry instrumentation
#podAnnotations:
#  instrumentation.opentelemetry.io/inject-dotnet: "true"
